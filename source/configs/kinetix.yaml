# What the Kinetix study runs: the arms, their settings, and the budget.
# The logic that reads this file is `source/utils/config.py:Kinetix`; the
# level list and the cells built from it are `source/envs/kinetix_levels.py`.
#
#     population        512
#     generations/level 200
#     rollouts/genome   1         (the level is deterministic)
#     episode length    128       (frame skip 2)
#     mutation sigma    0.5
#     crossover rate    0 (ga), 0.2 (dns_gaussian)
#     archive           256 of 512 = elite_ratio 0.5
#     policy            ActorOnlyPixelsRNN, recurrent off, 1,128,256 parameters
#
# The continual chain is twenty phases of `generations_per_level`, one per
# level. A stationary cell is the same 200 generations that level gets in the
# chain, cut into `noncontinual_phases` checkpoint phases. Nothing changes at
# those points -- the level is fixed -- and that is the point: a dormancy, rank
# or churn number only says something about task CHANGES if the same
# measurement on a run of the same length with no change does something
# different.

episode_length: 128                  # 256 in the working runs; inert past 128
ne_pop_size: 512
ne_num_evals: 1                      # 3 in the working runs; the level is deterministic
generations_per_level: 200
noncontinual_phases: 10

# RL half of the matched budget, per level. `train_ppo.PPO_CONFIGS` owns the
# shape; repeated here only so the loader can assert the two halves agree.
rl_num_envs: 128
rl_num_steps: 64
rl_updates: 1600                     # 128 x 64 steps an update
redo_interval: 50                    # updates between ReDo passes

# THE REPORTED CURVE, which is not the number the search selects on: the
# centroid and the population mean re-scored on FRESH keys with argmax actions.
# 10, as the gymnax and MiniGrid trees use, so one figure script reads all
# three bodies. Not part of the matched budget -- on a stationary cell 2
# genomes x 1 level x 10 episodes x 128 steps is 2,560 steps a generation
# against the 65,536 the population costs, 3.9%; the continual chain scores
# all 20 levels, so there it is 20x that. On this body the ten are ten copies
# of one deterministic rollout.
eval_episodes: 10

# The chunked scoring pass needs the population divisible by this.
eval_batch_size: 32


# `searcher_kwargs` goes to `ne.build_searcher`. `sigma` is the top-level name,
# NOT `sigma_init` inside searcher_kwargs: `run_nes` forwards its own `sigma`
# as `sigma_init`, so passing both is a duplicate keyword and the run dies at
# construction.
ne_arms:
  # The GA the paper reports on Kinetix: `ga_focus`, no crossover, a quarter
  # of the offspring always exploring at sigma 0.5
  # (`source/algorithms/ne/ga.py:FocusGASearcher`). Why not the plain GA:
  # Kinetix's archive fills with unrelated solvers of a level and their
  # centroid solves nothing; breeding from the best few at a shrinking sigma
  # consolidates it, and the explorers let a consolidated population search
  # the next level.
  ga:
    method: ga_focus
    sigma: 0.5
    searcher_kwargs: {elite_ratio: 0.5, cross_over_rate: 0.0, focus_rate: 0.3,
                      sigma_rate: 0.1, track_target: 0.9, sigma_min: 1.0e-5,
                      explore_fraction: 0.25}

  # ES with centred ranks and Adam (OpenAI-ES), sigma 0.02, lr 0.05.
  es: {method: es, sigma: 0.02, learning_rate: 0.05, optimizer: adam,
       shaping: centered_rank}

  # DNS: Iso+LineDD variation, iso 0.005 / line 0.05, k 3.
  #
  # The descriptor is the DUTY FACTOR -- what fraction of the episode each of
  # the six actuator bindings was driven (`kinetix.util.behaviour`). Not
  # AURORA, which is the default on the other bodies: AURORA's input here is
  # a 13-value per-step feature vector rather than the observation, so it is
  # available (`--dns_descriptor aurora`) but not what the paper uses. Duty
  # factor means the same thing on all twenty levels.
  dns:
    method: dns
    searcher_kwargs: {iso_sigma: 0.005, line_sigma: 0.05, k: 3, descriptor: handcrafted}

  # DNS bred with gaussian mutation (sigma 0.5, crossover 0.2).
  dns_gaussian:
    method: dns_gaussian
    sigma: 0.5
    searcher_kwargs: {cross_over_rate: 0.2, k: 3, descriptor: handcrafted}

# PPO and the three continual-RL baselines, all on `run_ppo`'s one loop. They
# differ in the mechanism the runner switches on (TRAC's rescaling, ReDo's
# recycling, C-CHAIN's regulariser), never in the budget or the optimizer.
# `pbt` (N = 8) and `pbt2` (N = 2): a population of the plain PPO learner over
# PPO's own budget, at two sizes (source/runners/train_ppo.py, the PBT block).
# `pbt_weights` / `pbt2_weights`: the same populations WITHOUT explore
# (--pbt_mode weights_only, 2026-09-19); the paper's PBT rows are `full`.
rl_arms: [ppo, trac, redo, cchain, pbt, pbt2, pbt_weights, pbt2_weights]

# The order the figures list them in: NE first, then RL. Kinetix reports both
# DNS operators.
reported_arms: [ga, es, dns, dns_gaussian, ppo, trac, redo, cchain, pbt, pbt2]
